services:
  - type: web
    name: chpapp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "web.app:create_app()" --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-2} --timeout 120
    envVars:
      - key: DATABASE_URL
        sync: false   # Set manually from Supabase. Consumed by storage/db.py (Task 2).
      - key: PYTHON_VERSION
        value: "3.11"
      - key: WEB_CONCURRENCY
        value: "2"
