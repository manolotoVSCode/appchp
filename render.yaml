services:
  - type: web
    name: chpapp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "web.app:create_app()" --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.9.6
