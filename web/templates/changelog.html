{% extends "clientes/_base.html" %}
{% block title %}Changelog{% endblock %}

{% block content %}
<div class="d-flex align-items-center gap-2 mb-4">
  <h4 class="fw-bold mb-0" style="color:var(--color-primary-dark)">Changelog</h4>
  {% if app_version %}
  <span class="badge" style="background:var(--color-primary)">v{{ app_version }}</span>
  {% endif %}
</div>

<div class="card shadow-sm" style="max-width:800px">
  <div class="card-body px-4 py-4 changelog-content">
    {{ content | safe }}
  </div>
</div>
{% endblock %}

{% block extra_styles %}
<style>
  .changelog-content h2 {
    font-size: 1.1rem; font-weight: 700; color: var(--color-primary-dark);
    border-bottom: 2px solid var(--color-primary-soft);
    padding-bottom: .4rem; margin-top: 2rem; margin-bottom: 1rem;
  }
  .changelog-content h2:first-child { margin-top: 0; }
  .changelog-content h3 {
    font-size: .9rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .05em; color: var(--color-text-secondary); margin-top: 1.25rem;
  }
  .changelog-content ul {
    padding-left: 1.25rem; margin-bottom: .75rem;
  }
  .changelog-content li { font-size: .9rem; margin-bottom: .3rem; }
  .changelog-content hr { border-color: var(--color-border); margin: 2rem 0; }
  .changelog-content p { font-size: .9rem; }
</style>
{% endblock %}
