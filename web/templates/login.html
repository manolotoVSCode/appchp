<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso — CHP Análisis Energético</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f4f8; }
    .login-card {
      max-width: 380px;
      margin: 10vh auto 0;
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
    }
    .login-header {
      background: #1F4E79;
      color: #fff;
      border-radius: 12px 12px 0 0;
      padding: 1.5rem 2rem 1.25rem;
    }
    .login-header h5 { margin: 0; font-weight: 600; letter-spacing: .02em; }
    .login-header small { opacity: .75; font-size: .82rem; }
    .card-body { padding: 2rem; }
  </style>
</head>
<body>
  <div class="login-card card">
    <div class="login-header">
      <h5>CHP Análisis Energético</h5>
      <small>Acceso restringido al equipo autorizado</small>
    </div>
    <div class="card-body">
      {% if error %}
        <div class="alert alert-danger py-2 small mb-3" role="alert">{{ error }}</div>
      {% endif %}
      <form method="POST" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label for="username" class="form-label fw-semibold">Usuario</label>
          <input type="text" id="username" name="username" class="form-control"
                 autocomplete="username" autofocus required>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label fw-semibold">Contraseña</label>
          <input type="password" id="password" name="password" class="form-control"
                 autocomplete="current-password" required>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary" style="background:#1F4E79;border-color:#1F4E79;">
            Iniciar sesión
          </button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
