<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Clientes{% endblock %} — CHP México</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .page-header { background: #1F4E79; color: #fff; padding: .75rem 1.25rem; display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
    .page-header .brand { font-weight: 700; font-size: 1rem; white-space: nowrap; }
    .page-header nav a { color: rgba(255,255,255,.8); text-decoration: none; font-size: .875rem; padding: .25rem .6rem; border-radius: .25rem; }
    .page-header nav a:hover { color: #fff; background: rgba(255,255,255,.15); }
    .page-header nav a.active { color: #fff; background: rgba(255,255,255,.2); font-weight: 600; }
    .page-header .ms-auto a { font-size: .8rem; }
    th { white-space: nowrap; }
  </style>
</head>
<body>

<div class="page-header">
  <span class="brand">&#9889; CHP — Análisis Energético</span>
  <nav class="d-flex gap-1 ms-3">
    <a href="{{ url_for('clientes.listado') }}" {% if nav_active == 'clientes' %}class="active"{% endif %}>Clientes</a>
    {% if cliente_id is defined and cliente_id %}
    <a href="{{ url_for('cliente_dashboard', cliente_id=cliente_id) }}" {% if nav_active == 'dashboard' %}class="active"{% endif %}>Dashboard</a>
    {% endif %}
  </nav>
  <div class="ms-auto d-flex gap-2 align-items-center">
    <a href="{{ url_for('auth.logout') }}" class="btn btn-sm btn-outline-light">Cerrar sesión</a>
  </div>
</div>

<div class="container-fluid px-4">

  {% for category, message in get_flashed_messages(with_categories=true) %}
  <div class="alert alert-{{ 'success' if category == 'success' else 'warning' if category == 'warning' else 'danger' }} alert-dismissible fade show mb-3" role="alert">
    {{ message }}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  {% endfor %}

  {% block content %}{% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
