<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activar cuenta — CHP App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --color-primary: #1F7A4C; --color-primary-dark: #155936; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #F0F4F1; font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; }
    .card-wrap { background: #fff; border-radius: 10px; box-shadow: 0 4px 24px rgba(0,0,0,.08); padding: 2.5rem; width: 100%; max-width: 420px; }
    .logo { font-size: .75rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--color-primary); margin-bottom: 2rem; }
    .form-label { font-weight: 600; font-size: .85rem; }
    .form-control { border-color: #D0D0D0; border-radius: 6px; padding: .6rem .85rem; font-size: .9rem; }
    .form-control:focus { border-color: var(--color-primary); box-shadow: 0 0 0 .2rem rgba(31,122,76,.18); }
    .btn-primary-chp { background: var(--color-primary); border: none; color: #fff; padding: .65rem 1rem; border-radius: 6px; font-weight: 600; font-size: .9rem; width: 100%; cursor: pointer; }
    .btn-primary-chp:hover { background: var(--color-primary-dark); }
  </style>
</head>
<body>
  <div class="card-wrap">
    <div class="logo">CHP App</div>
    <h5 style="font-weight:700;margin-bottom:.4rem">Activar cuenta</h5>
    <p style="font-size:.85rem;color:#5A5A5A;margin-bottom:1.5rem">Bienvenido. Elige una contraseña para tu cuenta (mínimo 8 caracteres).</p>

    {% if error %}
      <div style="background:#FEF0F0;border:1px solid #F0BCBC;border-radius:6px;padding:.6rem .85rem;font-size:.85rem;color:#B33A3A;margin-bottom:1rem;">{{ error }}</div>
    {% endif %}

    <form id="frmActivar" method="POST" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <!-- El token de invitación llega en el hash URL; JS lo extrae -->
      <input type="hidden" name="access_token" id="access_token_field">
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" id="password" name="password" class="form-control" minlength="8" autofocus required>
      </div>
      <div class="mb-4">
        <label for="password2" class="form-label">Confirmar contraseña</label>
        <input type="password" id="password2" name="password2" class="form-control" minlength="8" required>
      </div>
      <button type="submit" class="btn-primary-chp">Activar cuenta</button>
    </form>

    <div id="token-missing" style="display:none;background:#FEF0F0;border:1px solid #F0BCBC;border-radius:6px;padding:.6rem .85rem;font-size:.85rem;color:#B33A3A;margin-top:1rem;">
      El enlace de invitación no es válido o ha expirado. Contacta al administrador para recibir una nueva invitación.
    </div>
  </div>

  <script>
    (function() {
      // El token llega en el fragmento hash de la URL
      // e.g. /auth/aceptar-invitacion#access_token=xxx&type=invite
      var hash = window.location.hash.slice(1);
      var params = new URLSearchParams(hash);
      var token = params.get('access_token');
      var type = params.get('type');

      if (token && (type === 'invite' || type === 'magiclink' || !type)) {
        document.getElementById('access_token_field').value = token;
        history.replaceState(null, '', window.location.pathname + window.location.search);
      } else if (!document.getElementById('access_token_field').value) {
        {% if not error %}
        document.getElementById('frmActivar').style.display = 'none';
        document.getElementById('token-missing').style.display = 'block';
        {% endif %}
      }
    })();
  </script>
</body>
</html>
