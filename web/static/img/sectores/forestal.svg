<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" style="max-width:80px">
  <!-- Pine tree (three tiers) -->
  <!-- Top tier -->
  <polygon points="50,14 36,40 64,40" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Middle tier -->
  <polygon points="50,28 28,58 72,58" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Bottom tier -->
  <polygon points="50,42 20,72 80,72" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Trunk -->
  <rect x="44" y="70" width="12" height="16" rx="2" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
